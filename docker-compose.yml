services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yexis}
      POSTGRES_USER: ${POSTGRES_USER:-yexis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env file}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in the project-root .env file}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the project-root .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init/create_app_role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-yexis}
      POSTGRES_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in the project-root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the project-root .env file}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  gateway:
    build: ./backend
    command: ["sh", "-c", "uvicorn gateway.main:app --host 0.0.0.0 --port 8001"]
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-yexis}
      POSTGRES_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in the project-root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the project-root .env file}
      APP_ENV: production
      BACKEND_URL: http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

volumes:
  pgdata:
